<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fighter Game</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071522;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;color:#67e8f9;text-shadow:0 0 7px #67e8f9;font-weight:bold;pointer-events:none}
#stats{position:absolute;top:12px;left:14px;direction:ltr;line-height:1.65;font-size:14px}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px}
#heading{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);direction:ltr;font-size:14px}
#joystick{position:absolute;left:22px;bottom:22px;width:125px;height:125px;border:2px solid #67e8f9;border-radius:50%;background:#12313a66;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border:2px solid #67e8f9;border-radius:50%;background:#67e8f933}
.btn{position:absolute;right:22px;width:65px;height:65px;border:1px solid #67e8f9;border-radius:14px;background:#061923cc;color:#67e8f9;font-size:25px;pointer-events:auto}
#up{bottom:97px}#down{bottom:22px}
#loading{position:fixed;right:14px;bottom:12px;color:#67e8f9;font-size:13px;pointer-events:none}
#portrait{display:none;position:fixed;inset:0;z-index:10;background:#071522;color:#67e8f9;align-items:center;justify-content:center;text-align:center;font-size:20px}
</style>
</head>
<body>
<div id="portrait">📱<br><br>گوشی را افقی کنید</div>
<div id="hud">
  <div id="stats">SPEED <span id="speed">180</span><br>ALT <span id="alt">500</span><br>THR <span id="thr">45</span>%</div>
  <div id="cross">+</div>
  <div id="heading">HDG <span id="hdg">000</span></div>
  <div id="joystick"><div id="knob"></div></div>
  <button class="btn" id="up">▲</button>
  <button class="btn" id="down">▼</button>
</div>
<div id="loading">در حال بارگذاری...</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x071522);
scene.fog=new THREE.Fog(0x071522,500,2600);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,6000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbdefff,0x17221b,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(400,700,300);
scene.add(sun);

const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(5000,5000),
  new THREE.MeshStandardMaterial({color:0x1b2922})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-300;
scene.add(ground);

const grid=new THREE.GridHelper(5000,100,0x31515b,0x1b3037);
grid.position.y=-299;
scene.add(grid);

function fighterModel(){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0x8b969c,metalness:.7,roughness:.35});
  const dark=new THREE.MeshStandardMaterial({color:0x5d686f,metalness:.6});
  const body=new THREE.Mesh(new THREE.ConeGeometry(10,72,8),mat);
  body.rotation.x=Math.PI/2;
  g.add(body);

  const nose=new THREE.Mesh(new THREE.ConeGeometry(5,24,8),mat);
  nose.rotation.x=-Math.PI/2;
  nose.position.z=-47;
  g.add(nose);

  const shape=new THREE.Shape();
  shape.moveTo(0,0); shape.lineTo(-62,0); shape.lineTo(-10,-25); shape.lineTo(0,0);
  const wg=new THREE.ShapeGeometry(shape);
  const lw=new THREE.Mesh(wg,dark);
  lw.rotation.x=-Math.PI/2; lw.position.y=2; g.add(lw);
  const rw=lw.clone(); rw.scale.x=-1; g.add(rw);

  const tail=new THREE.Mesh(new THREE.BoxGeometry(5,25,18),dark);
  tail.position.set(0,15,28); tail.rotation.x=-.25; g.add(tail);

  const glow=new THREE.Mesh(
    new THREE.SphereGeometry(4,12,12),
    new THREE.MeshBasicMaterial({color:0x66ddff})
  );
  glow.position.z=38; g.add(glow);
  return g;
}

const jet=fighterModel();
scene.add(jet);

let speed=180, throttle=.45, yaw=0, pitch=0, roll=0;
let ix=0, iy=0, pointerId=null;

const stick=document.getElementById("joystick");
const knob=document.getElementById("knob");

function stickMove(x,y){
  const r=stick.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2, max=r.width*.37;
  let dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max;dy=dy/d*max}
  ix=dx/max; iy=dy/max;
  knob.style.left=`calc(50% + ${dx}px)`;
  knob.style.top=`calc(50% + ${dy}px)`;
}
function stickReset(){
  pointerId=null; ix=0; iy=0;
  knob.style.left="50%"; knob.style.top="50%";
}
stick.addEventListener("pointerdown",e=>{
  pointerId=e.pointerId; stick.setPointerCapture(pointerId);
  stickMove(e.clientX,e.clientY);
});
stick.addEventListener("pointermove",e=>{
  if(e.pointerId===pointerId) stickMove(e.clientX,e.clientY);
});
stick.addEventListener("pointerup",stickReset);
stick.addEventListener("pointercancel",stickReset);

document.getElementById("up").addEventListener("pointerdown",()=>{
  throttle=Math.min(1,throttle+.05);
});
document.getElementById("down").addEventListener("pointerdown",()=>{
  throttle=Math.max(0,throttle-.05);
});

addEventListener("keydown",e=>{
  if(e.key==="ArrowUp") throttle=Math.min(1,throttle+.05);
  if(e.key==="ArrowDown") throttle=Math.max(0,throttle-.05);
  if(e.key==="ArrowLeft") ix=-1;
  if(e.key==="ArrowRight") ix=1;
});

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);

  const target=80+throttle*420;
  speed=THREE.MathUtils.lerp(speed,target,dt*2.5);
  pitch=THREE.MathUtils.lerp(pitch,-iy*.5,dt*5);
  roll=THREE.MathUtils.lerp(roll,-ix*.7,dt*5);
  yaw+=ix*dt*.9;

  jet.rotation.set(pitch,yaw,roll);

  const forward=new THREE.Vector3(0,0,-1).applyQuaternion(jet.quaternion);
  jet.position.addScaledVector(forward,speed*dt*.35);
  jet.position.y=Math.max(jet.position.y,-200);

  const camOffset=new THREE.Vector3(0,40,130).applyQuaternion(jet.quaternion);
  const desired=jet.position.clone().add(camOffset);
  camera.position.lerp(desired,1-Math.pow(.001,dt));

  camera.lookAt(jet.position.clone().addScaledVector(forward,130));

  document.getElementById("speed").textContent=Math.round(speed);
  document.getElementById("alt").textContent=Math.round(jet.position.y+300);
  document.getElementById("thr").textContent=Math.round(throttle*100);
  const h=(THREE.MathUtils.radToDeg(yaw)%360+360)%360;
  document.getElementById("hdg").textContent=String(Math.round(h)).padStart(3,"0");

  renderer.render(scene,camera);
}

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

function orientation(){
  document.getElementById("portrait").style.display=
    innerHeight>innerWidth?"flex":"none";
}
orientation();
addEventListener("resize",orientation);

document.getElementById("loading").textContent="READY";
animate();
</script>
</body>
</html>
